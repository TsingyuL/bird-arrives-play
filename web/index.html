<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <base href="../">
  <meta name="theme-color" content="#d4e8ed">
  <title>鸟儿来了 · 网页版</title>
  <link rel="icon" href="village-assets/icon-bird.png">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background: #d4e8ed;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    #frame {
      position: relative;
      width: min(100vw, calc(100dvh * 390 / 844), 390px);
      aspect-ratio: 390 / 844;
      overflow: hidden;
      background: #d4e8ed;
      box-shadow: 0 18px 64px rgba(44, 76, 75, .24);
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #loading, #error {
      position: absolute;
      z-index: 2;
      text-align: center;
    }
    [hidden] { display: none !important; }
    #loading { pointer-events: auto; }
    #error { pointer-events: none; }
    #retry { position: absolute; z-index: 4; bottom: 22%; left: 50%; transform: translateX(-50%);
      border: 2px solid #8d6037; background: #f6e5ae; color: #765534; border-radius: 12px;
      font-size: 15px; font-weight: 700; padding: 12px 18px; min-width: 155px; cursor: pointer; }
    #storage-warning { position: absolute; bottom: 8px; left: 5%; width: 90%; z-index: 5; color: #765534;
      font-size: 11px; text-align: center; background: rgba(255,247,221,.93); border-radius: 8px; padding: 5px; pointer-events: none; }
    .loading-progress { display: block; }
    .loading-sign, .loading-bottom, .loading-copy { pointer-events: none; }
    .loading-label { font-size: 14px; }
    #error:not(:empty) { background: rgba(255,244,223,.95); padding: 12px 8px; border-radius: 10px; }
    #loading {
      inset: 0;
      overflow: hidden;
      color: #66583a;
      background: linear-gradient(180deg, #a9e3e7 0%, #d8efc0 58%, #b7dc8c 100%);
      transition: opacity .28s ease, transform .28s ease;
    }
    #loading.done { opacity: 0; transform: scale(1.01); }
    #loading.done > * { opacity: 0; }
    .loading-sun, .loading-cloud, .loading-leaf { display: none; }
    .loading-cloud::before, .loading-cloud::after { content: ""; position: absolute; bottom: 0; border-radius: 50%; background: inherit; }
    .loading-cloud::before { width: 36px; height: 36px; left: 10px; }
    .loading-cloud::after { width: 29px; height: 29px; right: 8px; }
    .cloud-a { top: 108px; left: -17px; animation: cloud-drift 6s ease-in-out infinite; }
    .cloud-b { top: 145px; right: -18px; transform: scale(.68); animation: cloud-drift 7s ease-in-out -2s infinite reverse; }
    .loading-sign { position: absolute; top: 33%; left: 50%; width: 100%; min-height: 0; transform: translateX(-50%); padding: 0 24px; border: 0; background: none; box-shadow: none; }
    .loading-sign strong { display: block; color: #536b45; font-size: 24px; font-weight: 850; letter-spacing: .08em; line-height: 1.15; text-shadow: none; white-space: nowrap; }
    .loading-sign small { display: block; margin-top: 9px; padding: 0; color: rgba(75,101,67,.72); font-size: 10px; font-weight: 650; letter-spacing: .04em; border: 0; background: none; white-space: nowrap; }
    .loading-bird { position: absolute; width: 34px; height: 29px; border: 2px solid #966938; border-radius: 55% 55% 48% 50%; background: #ffd45d; animation: bird-bob 1.1s ease-in-out infinite; }
    .loading-bird::before { content: ""; position: absolute; right: -15px; top: 13px; border-width: 6px 0 6px 15px; border-style: solid; border-color: transparent transparent transparent #f5a83b; }
    .loading-bird::after { content: "•"; position: absolute; right: 6px; top: -5px; color: #4f5d45; font-size: 21px; }
    .bird-top { top: 24%; left: 50%; right: auto; transform: translateX(-50%) scale(.82); }
    .bird-field { display: none; }
    .loading-leaf { position: absolute; width: 19px; height: 10px; border-radius: 100% 0 100% 0; background: #78b950; animation: leaf-float 4.2s ease-in-out infinite; }
    .leaf-a { left: 14%; top: 9%; transform: rotate(45deg); }
    .leaf-b { right: 10%; top: 37%; animation-delay: -1.7s; }
    .leaf-c { left: 12%; bottom: 18%; animation-delay: -2.5s; }
    .loading-copy { display: none; }
    .loading-bottom { position: absolute; left: 20%; right: 20%; top: 53%; bottom: auto; }
    .loading-label { display: block; margin-bottom: 8px; font-size: 11px; font-weight: 720; letter-spacing: .03em; white-space: nowrap; }
    .loading-track { position: relative; height: 14px; padding: 2px; overflow: visible; border: 2px solid rgba(255,255,255,.88); border-radius: 12px; background: rgba(255,255,255,.43); box-shadow: 0 2px 7px rgba(70,120,70,.1); }
    .loading-fill { display: block; width: 0; height: 100%; overflow: hidden; border-radius: 14px; background: repeating-linear-gradient(125deg,#76cb4d 0 13px,#9bdd65 13px 24px); box-shadow: inset 0 2px 4px rgba(255,255,255,.35); transition: width .2s ease-out; }
    .loading-fill::after { content: ""; display: block; width: 160%; height: 100%; background: repeating-linear-gradient(125deg,transparent 0 13px,rgba(255,255,255,.2) 13px 20px); animation: stripe-slide 1s linear infinite; }
    .loading-tip { display: block; margin-top: 8px; color: rgba(65,103,61,.56); font-size: 8.5px; letter-spacing: .01em; white-space: nowrap; }
    #error { left: 5%; bottom: 29%; width: 90%; color: #a33; font-size: 12px; overflow-wrap: anywhere; }
    @keyframes stripe-slide { to { transform: translateX(24px); } }
    @keyframes bird-bob { 50% { margin-top: -7px; transform: rotate(4deg) scale(var(--bird-scale,1)); } }
    @keyframes leaf-float { 50% { translate: 8px 22px; rotate: 80deg; } }
    @keyframes cloud-drift { 50% { translate: 18px 4px; } }
    @keyframes sign-sway { 50% { transform: translateX(-50%) rotate(1deg); } }
    @media (prefers-reduced-motion: reduce) { .loading-sign, .loading-bird, .loading-leaf, .loading-cloud, .loading-fill::after { animation-duration: .001ms; animation-iteration-count: 1; } }
    @media (max-width: 430px) { #frame { box-shadow: none; } }
  </style>
</head>
<body>
  <main id="frame" aria-label="鸟儿来了网页版">
    <canvas id="game" aria-label="鸟儿来了游戏画面"></canvas>
    <section id="loading" hidden aria-hidden="true"></section>
    <output id="error" role="alert"></output>
    <button type="button" id="retry" hidden>重新加载游戏</button>
    <div id="storage-warning" role="status" hidden>当前浏览器无法保存进度，本次游玩仅临时有效</div>
  </main>
  <script src="web/native.bundle.js?v=rescue-zoom-20261102"></script>
  <script src="web/native-runtime.js?v=rescue-zoom-20261102"></script>
</body>
</html>
